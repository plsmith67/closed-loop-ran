# ---------- Loop ----------
loop:
  cycles: 4
  rop_minutes: 15
  # Per-fault Level 4 graduation: only these types skip the human gate.
  # pim stays Level 3 (not listed). unknown/multiple never auto-approve in code.
  auto_approve_faults: [ul_interference, overshoot, congestion, combined, sleeping_cell]

# ---------- Simulator ----------
simulator:
  seed: 7
  sites: 8                   # 3 sectors each
  fix_success_rate: 0.85     # chance an approved action actually clears the fault
  faults:
    SITE003_B: ul_interference
    SITE006_A: overshoot
    SITE007_C: congestion
    SITE002_A: combined
    SITE004_C: sleeping_cell
    SITE008_B: pim

# ---------- Detection ----------
detect:
  thresholds:
    drop_rate_pct:   [gt, 2.0]
    rrc_success_pct: [lt, 97.0]
    ul_noise_dbm:    [gt, -108.0]
    prb_util_pct:    [gt, 85.0]
    sleeping_cell_prb: [lt, 5.0]
  ml:
    enabled: true
    contamination: 0.04

# ---------- Diagnosis ----------
diagnose:
  # rules  = rule-based RCA only
  # llm    = LLM drives decisions (falls back to rules if LLM fails)
  # shadow = rules drive decisions, LLM runs alongside and agreement is logged
  mode: rules
  llm:
    url: http://localhost:11434/api/generate   # change to http://<jetson-ip>:11434/... later
    model: llama3.1:8b
    timeout_s: 180

# ---------- Output ----------
output:
  log_dir: logs
